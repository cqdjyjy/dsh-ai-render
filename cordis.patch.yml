- insert:
    - id: ai-render
      name: '@local/dsh-ai-render'
      config:
        arkApiKey: ''
        arkModel: doubao-seedream-4-0-250828
        dashscopeApiKey: ''
        dashscopeModel: qwen-image-edit-plus
        # 第三方中转站（OpenAI 兼容）。AILink 类站主力是异步任务接口：
        # auto 会优先走 /v1/images/edits/async 再轮询 /v1/images/tasks/{id}。
        openaiApiKey: ''
        openaiBaseUrl: ''
        openaiModel: gpt-image-2
        # auto | async | async-linkai | edits | generations | chat
        openaiMode: auto
        # 异步任务专用：画质档位（留空 = 服务端默认 auto）、图生图模式
        openaiQuality: ''
        # ---- Google Gemini 通道（本机 Antigravity CLI agy，不需要 API Key）----
        # 它不是生图 API，而是驱动一个有文件系统权限的 CLI agent：
        # 图片靠「把文件路径写进提示词」传进去，出图靠扫 agy 数据目录里的新文件。
        agyBin: agy
        agyModel: gemini-3.7-flash-medium
        # low | medium | high，留空 = 用 agy 默认
        agyEffort: ''
        # agy 数据目录，留空 = ~/.gemini/antigravity-cli
        agyHome: ''
        # agy 是 Go 程序，只认 HTTPS_PROXY；本机系统代理 PowerShell 能用但 agy 不会用
        agyProxy: ''
        openaiImageMode: image_to_image
        # 同步 edits 形态的多图字段名：auto | image | image[]
        openaiImageField: auto
        # 同步 generations 形态是否把参考图放进 image 字段（1/0）
        openaiIncludeRefs: '1'
        defaultProvider: ark
        outputDir: ''
        maxSide: 2048
        # 异步任务要排队 + 轮询，默认给足 10 分钟
        timeoutMs: 600000
        promptTemplate: ''
        # ---- 本地 GPU 超分（Real-ESRGAN ncnn Vulkan，不联网、不花钱）----
        # 引擎路径。留空 = 依次找「插件自管目录」和系统 PATH；
        # 面板上的「下载引擎」会把它装到 <DSH_HOME>/ai-render/tools/realesrgan。
        esrganBin: ''
        # realesrgan-x4plus（写实，推荐）| realesrgan-x4plus-anime | realesr-animevideov3（最省显存）
        esrganModel: realesrgan-x4plus
        # 2 | 3 | 4
        esrganScale: '4'
        # 显存占用的唯一旋钮：越小越不容易爆显存，但越慢。0 = 交给 ncnn 自己算。
        # 默认 64：实测 4GB 的 Kepler 卡（Quadro K4200）在 128 上稳定出全黑、在 64 上正常。
        # 显存够可以调 192 / 256（快不少）；跑失败时插件会自动降一档重试。
        esrganTile: '64'
        # 多卡时指定用哪块（-g），留空 = auto
        esrganGpu: ''
        # TTA 增强（-x）：每个 tile 算 8 遍再平均，更干净但慢 8 倍左右
        esrganTta: '0'
        # 下载地址覆盖口：国内直连 GitHub 经常不通，可以填镜像地址
        esrganDownloadUrl: ''
